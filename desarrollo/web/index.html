<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    El marcador de base href se reemplaza con el valor de --base-href de
    flutter build. Debe empezar y terminar con "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ManoLegal: directorio de abogados en Cali con verificación documental. Busca por especialidad y zona, revisa su perfil y contáctalos directamente por WhatsApp o correo.">
  <meta name="theme-color" content="#0A1930">

  <meta property="og:title" content="ManoLegal — Justicia accesible, verificada">
  <meta property="og:description" content="Directorio de abogados en Cali con verificación documental. En la Web y en Android.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <!-- Las redes exigen una URL absoluta para og:image: reemplazar cuando la web tenga dominio propio. -->
  <meta property="og:image" content="og-imagen.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ManoLegal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ManoLegal — Abogados verificados en Cali</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pantalla de carga de marca: evita la página en blanco mientras se descarga
    el motor de Flutter. Se retira con el primer cuadro de la app.
  -->
  <style>
    html, body { margin: 0; background: #0A1930; }
    #carga-inicial {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 42%, #0F2A52 0%, #0A1930 45%, #050B16 100%);
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #fff;
      transition: opacity .35s ease;
    }
    #carga-inicial .simbolo {
      width: 72px; height: 72px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0F2A52, #0A1930);
      box-shadow: 0 0 0 1.5px rgba(201, 162, 39, .75), 0 18px 48px rgba(0, 0, 0, .45);
    }
    #carga-inicial .nombre { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    #carga-inicial .barra { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .12); }
    #carga-inicial .barra span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #C9A227; animation: avance 1.2s ease-in-out infinite; }
    @keyframes avance { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #carga-inicial { transition: none; }
      #carga-inicial .barra span { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="carga-inicial" aria-hidden="true">
    <div class="simbolo">
      <svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 9v29M15 40h18M10 14h28"/>
        <path d="M10 14 4 26h12zM38 14l-6 12h12z"/>
        <circle cx="24" cy="9" r="2.5" fill="#fff"/>
      </svg>
    </div>
    <div class="nombre">ManoLegal</div>
    <div class="barra"><span></span></div>
  </div>
  <noscript>ManoLegal necesita JavaScript para funcionar.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga-inicial');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
